name: PR quality

on:
  workflow_call:
    outputs:
      build:
        description: Whether compiled-code checks are required
        value: ${{ jobs.gate.outputs.build }}

permissions:
  contents: read

jobs:
  checks:
    name: Changed-file checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.changes.outputs.build == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install quality tools
        run: |
          python -m pip install black==25.1.0 flake8==7.2.0 clang-format==18.1.8
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Test paired benchmark inference and guards
        run: python -m unittest discover -s admin/benchmarks
      - name: Check canonical corpus integrity and selection
        run: python -m unittest discover -s tests/corpus
      - name: Test change classification and header analysis selection
        run: python .github/scripts/test_pr_quality.py
      - name: Classify changes against the Bromax merge base
        id: changes
        env:
          TARGET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$TARGET_BASE" ] || [ "$TARGET_BASE" = 0000000000000000000000000000000000000000 ]; then
            TARGET_BASE=$(git rev-parse HEAD^)
          fi
          base=$(git merge-base "$TARGET_BASE" HEAD)
          python .github/scripts/pr-quality.py changes --base "$base" | tee changes.log
      - name: Validate workflows
        run: /tmp/actionlint .github/workflows/*.yml 2>&1 | tee workflow-lint.log
      - name: Check changed C/C++ formatting
        env:
          CLANG_FORMAT: clang-format
          MERGE_BASE: ${{ steps.changes.outputs.base }}
        run: |
          admin/clang-format.sh --rev="$MERGE_BASE" diff > formatting.patch
          admin/clang-format.sh --rev="$MERGE_BASE" check 2>&1 | tee formatting.log
      - name: Check changed copyright headers
        env:
          MERGE_BASE: ${{ steps.changes.outputs.base }}
        run: admin/copyright.sh --rev="$MERGE_BASE" check 2>&1 | tee copyright.log
      - name: Check changed Python
        run: python .github/scripts/pr-quality.py python 2>&1 | tee python-lint.log
      - name: Test changed container recipe helpers
        env:
          MERGE_BASE: ${{ steps.changes.outputs.base }}
        run: |
          if git diff --name-only "$MERGE_BASE" HEAD -- admin/containers/ | grep -q .; then
            python -m pip install hpccm==26.5.0
            python admin/containers/test_build_helpers.py
          fi
      - name: Save classified paths
        uses: actions/upload-artifact@v4
        with:
          name: classified-paths
          path: changed-files.json
          retention-days: 1
      - name: Upload patches and quality logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-logs
          retention-days: 7
          path: |
            changes.log
            workflow-lint.log
            formatting.patch
            formatting.log
            copyright.log
            python-lint.log

  smoke:
    name: Linux smoke and static analysis
    needs: checks
    if: needs.checks.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-18
      CXX: clang++-18
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 600M
      CI_JOB_ID: ${{ github.run_id }}
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: classified-paths
      - name: Install compilation and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang-18 clang-tidy-18 ninja-build ccache libfftw3-dev
      - name: Verify the clang-tidy header and failure path
        run: python3 .github/scripts/test_pr_quality.py
      - uses: actions/cache@v5
        with:
          path: .ccache
          key: linux-clang-Release-thread-mpi-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            linux-clang-Release-thread-mpi-${{ hashFiles('CMakeLists.txt', 'cmake/**', '**/CMakeLists.txt') }}-
            linux-clang-Release-thread-mpi-
      - name: Configure CPU compile database
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DGMX_COMPILER_WARNINGS=ON \
            -DGMX_GPU=OFF -DGMX_SIMD=None -DGMX_BUILD_UNITTESTS=ON \
            -DREGRESSIONTEST_DOWNLOAD=OFF 2>&1 | tee configure.log
      - name: Build application and test dependencies
        run: cmake --build build --target all tests --parallel 2 2>&1 | tee build.log
      - name: Run unit smoke tests
        run: ctest --test-dir build -L UnitTest --output-on-failure --no-tests=error --parallel 2 --output-junit smoke-junit.xml 2>&1 | tee smoke.log
      - name: Analyze changed C++ and header consumers
        run: python3 .github/scripts/pr-quality.py tidy --build build 2>&1 | tee clang-tidy.log
      - name: Upload smoke and analysis diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          retention-days: 7
          path: |
            configure.log
            build.log
            smoke.log
            clang-tidy.log
            build/smoke-junit.xml
            build/compile_commands.json
            build/Testing/Temporary/

  gate:
    name: PR quality gate
    needs: [checks, smoke]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ needs.checks.outputs.build }}
    steps:
      - name: Require applicable checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          BUILD_REQUIRED: ${{ needs.checks.outputs.build }}
        run: |
          test "$CHECKS_RESULT" = success
          if [ "$BUILD_REQUIRED" = true ]; then
            test "$SMOKE_RESULT" = success
          else
            test "$SMOKE_RESULT" = skipped
          fi
