name: CMake Build Matrix

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_VERSION: 3.28.0 # Oldest supported
  NINJA_VERSION: 1.12.1 # Latest
  BUILD_TYPE: Release
  CCACHE_VERSION: 4.12.3 # Latest
  NINJA_STATUS: "[%f/%t %o/sec] "

jobs:
  build:
    if: github.repository == 'fabiobove-dr/bromax'
    timeout-minutes: 60
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows MSVC 2022", artifact: "Windows-MSVC-2022.7z",
            os: windows-2022,
            cc: "cl", cxx: "cl",
            environment_script: "vcvars64.bat",
            gpu_var: "Off",
            openmp_var: "On"
          }
        - {
            name: "Windows ARM64 MSVC", artifact: "Windows-ARM64-MSVC-2022.7z",
            os: windows-11-arm,
            cc: "cl", cxx: "cl",
            environment_script: "vcvarsarm64.bat",
            gpu_var: "Off",
            openmp_var: "On"
          }
        - {
            name: "macOS Latest Clang", artifact: "macOS.7z",
            # In a release branch, we should fix this for the lifetime
            # of the branch.
            os: macos-latest,
            cc: "clang", cxx: "clang++",
            gpu_var: "Off",
            openmp_var: "Off"
          }
        - {
            name: "macOS Latest GCC 15 with OpenCL", artifact: "macOS-gcc-OpenCL.7z",
            # In a release branch, we should fix this for the lifetime
            # of the branch.
            os: macos-latest,
            cc: "gcc-15", cxx: "g++-15",
            gpu_var: "OpenCL",
            openmp_var: "On"
          }

    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}
      CI_JOB_ID: ${{ github.sha }} # Tell CMake it's running in CI
      OPENMP_VAR: ${{ matrix.config.openmp_var }}
      GPU_VAR: ${{ matrix.config.gpu_var }}
      ENVIRONMENT_SCRIPT: ${{ matrix.config.environment_script }}

    steps:
    - uses: actions/checkout@v6
      with:
        show-progress: false
        persist-credentials: false

    - name: Download Ninja, CMake, and CCache
      run: cmake -P .github/scripts/download-ninja-cmake.cmake

    - name: ccache cache files
      uses: actions/cache@v5
      with:
        path: .ccache
        key: ${{ matrix.config.name }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ matrix.config.name }}-ccache-

    - name: Fetch versioned regression tests
      run: cmake -P .github/scripts/fetch-regressiontests.cmake

    - name: Locate Visual Studio toolchain
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
        $vsPath = & $vswhere -latest -products '*' -property installationPath
        $script = "$vsPath/VC/Auxiliary/Build/$env:ENVIRONMENT_SCRIPT"
        if (-not (Test-Path $script)) { throw "Visual Studio environment script missing: $script" }
        "ENVIRONMENT_SCRIPT=$script" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Configure
      run: cmake -P .github/scripts/configure.cmake

    - name: Build
      run: cmake -P .github/scripts/build.cmake

    - name: Run tests
      run: cmake -P .github/scripts/test.cmake


    - name: Upload diagnostic logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.config.name }}-logs
        retention-days: 7
        path: |
          build/CMakeCache.txt
          build/CMakeFiles/CMakeConfigureLog.yaml
          build/Testing/Temporary/
