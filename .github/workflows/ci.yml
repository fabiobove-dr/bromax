name: Bromax CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.repository == 'fabiobove-dr/bromax'
    uses: ./.github/workflows/quality.yml
  linux:
    needs: quality
    if: needs.quality.outputs.build == 'true'
    uses: ./.github/workflows/linux.yml
  platforms:
    needs: quality
    if: needs.quality.outputs.build == 'true' && github.event_name != 'schedule'
    uses: ./.github/workflows/build_cmake.yml
  result:
    name: Bromax CI result
    needs: [quality, linux, platforms]
    if: always() && github.repository == 'fabiobove-dr/bromax'
    runs-on: ubuntu-24.04
    steps:
      - name: Require the requested coverage
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_REQUIRED: ${{ needs.quality.outputs.build }}
          LINUX_RESULT: ${{ needs.linux.result }}
          PLATFORMS_RESULT: ${{ needs.platforms.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$QUALITY_RESULT" = success
          if [ "$BUILD_REQUIRED" = true ]; then
            test "$LINUX_RESULT" = success
            if [ "$EVENT_NAME" = schedule ]; then
              test "$PLATFORMS_RESULT" = skipped
            else
              test "$PLATFORMS_RESULT" = success
            fi
          else
            test "$LINUX_RESULT" = skipped
            test "$PLATFORMS_RESULT" = skipped
          fi
